[package]
name = "bitter-dotcom-generator"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }

[profile.release]
lto = true
codegen-units = 1
